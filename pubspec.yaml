name: aquapath
description: "AquaPath — Real-time water truck tracking for Gaza Strip"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.0
  cloud_functions: ^5.1.0

  # Maps & Location
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Security
  flutter_secure_storage: ^9.2.2

  # Dependency Injection
  get_it: ^8.0.0

  # Networking
  connectivity_plus: ^6.0.3

  # UI
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  package_info_plus: ^8.1.1

  # Reports export (Organization → Reports & Analytics)
  pdf: ^3.12.0
  excel: ^4.0.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
